<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">coding-task-benchmark</title>
  <desc id="desc">A local race board where coding-agent CLIs race on one task. Five lanes of colored attempt slots end in best scores, like the page itself.</desc>

  <defs>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#16141d"/>
      <rect width="5" height="14" fill="#3fe0a0" fill-opacity="0.32"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="24" fill="#0c0b10"/>

  <g id="title-block" transform="translate(56 0)">
    <g transform="translate(0 68)">
      <rect x="0" y="12" width="9" height="20" rx="2.5" fill="#ffc531"/>
      <rect x="13" y="0" width="9" height="32" rx="2.5" fill="#ff6b4a"/>
      <rect x="26" y="7" width="9" height="25" rx="2.5" fill="#3fe0a0"/>
      <text x="50" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1.5" fill="#a29fae">LOCAL RACE BOARD</text>
    </g>
    <text x="0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#f4f4f7">coding-task-</text>
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#f4f4f7">benchmark</text>
    <text x="0" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#f4f4f7">Coding agents race on one task.</text>
    <text x="0" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#a29fae">Every attempt is graded on the same hidden tests.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#a29fae">
      <text x="0" y="340">claude · codex · grok</text>
      <text x="260" y="340">python · fastapi · js · express</text>
    </g>
  </g>

  <g id="race" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="652" y="40" width="508" height="300" rx="18" fill="#16141d"/>

    <g transform="translate(676 66)">
      <text x="0" y="31" font-size="24" font-weight="800" fill="#4ea8ff">1</text>
      <rect x="34" y="14" width="13" height="13" rx="3" fill="#4ea8ff" transform="rotate(45 40.5 20.5)"/>
      <rect x="62" y="0" width="92" height="42" rx="7" fill="none" stroke="#4ea8ff" stroke-width="2"/>
      <text x="76" y="28" font-size="18" font-weight="700" fill="#4ea8ff">✕ 1/3</text>
      <rect x="162" y="0" width="92" height="42" rx="7" fill="#4ea8ff"/>
      <text x="176" y="28" font-size="18" font-weight="700" fill="#120f0a">✓ 3/3</text>
      <rect x="262" y="0" width="92" height="42" rx="7" fill="#4ea8ff"/>
      <text x="276" y="28" font-size="18" font-weight="700" fill="#120f0a">✓ 3/3</text>
      <text x="460" y="32" text-anchor="end" font-size="30" font-weight="800" fill="#4ea8ff">96.1</text>
    </g>

    <g transform="translate(676 120)">
      <text x="0" y="31" font-size="24" font-weight="800" fill="#6f6b7d">2</text>
      <rect x="34" y="14" width="13" height="13" rx="3" fill="#ffc531" transform="rotate(45 40.5 20.5)"/>
      <rect x="62" y="0" width="92" height="42" rx="7" fill="#ffc531"/>
      <text x="76" y="28" font-size="18" font-weight="700" fill="#120f0a">✓ 3/3</text>
      <rect x="162" y="0" width="92" height="42" rx="7" fill="#ffc531"/>
      <text x="176" y="28" font-size="18" font-weight="700" fill="#120f0a">✓ 3/3</text>
      <rect x="262" y="0" width="92" height="42" rx="7" fill="#ffc531"/>
      <text x="276" y="28" font-size="18" font-weight="700" fill="#120f0a">✓ 3/3</text>
      <text x="460" y="32" text-anchor="end" font-size="30" font-weight="800" fill="#ffc531">94.4</text>
    </g>

    <g transform="translate(676 174)">
      <text x="0" y="31" font-size="24" font-weight="800" fill="#6f6b7d">3</text>
      <rect x="34" y="14" width="13" height="13" rx="3" fill="#ff5fae" transform="rotate(45 40.5 20.5)"/>
      <rect x="62" y="0" width="92" height="42" rx="7" fill="#ff5fae"/>
      <text x="76" y="28" font-size="18" font-weight="700" fill="#120f0a">✓ 3/3</text>
      <rect x="162" y="0" width="92" height="42" rx="7" fill="#ff5fae"/>
      <text x="176" y="28" font-size="18" font-weight="700" fill="#120f0a">✓ 3/3</text>
      <rect x="262" y="0" width="92" height="42" rx="7" fill="none" stroke="#ff5fae" stroke-width="2"/>
      <text x="276" y="28" font-size="18" font-weight="700" fill="#ff5fae">✕ 2/3</text>
      <text x="460" y="32" text-anchor="end" font-size="30" font-weight="800" fill="#ff5fae">94.3</text>
    </g>

    <g transform="translate(676 228)">
      <text x="0" y="31" font-size="24" font-weight="800" fill="#6f6b7d">4</text>
      <rect x="34" y="14" width="13" height="13" rx="3" fill="#3fe0a0" transform="rotate(45 40.5 20.5)"/>
      <rect x="62" y="0" width="92" height="42" rx="7" fill="#3fe0a0"/>
      <text x="76" y="28" font-size="18" font-weight="700" fill="#120f0a">✓ 3/3</text>
      <rect x="162" y="0" width="92" height="42" rx="7" fill="#3fe0a0"/>
      <text x="176" y="28" font-size="18" font-weight="700" fill="#120f0a">✓ 3/3</text>
      <rect x="262" y="0" width="92" height="42" rx="7" fill="url(#stripes)" stroke="#3fe0a0" stroke-width="2"/>
      <text x="276" y="28" font-size="17" font-weight="700" fill="#3fe0a0">running</text>
      <text x="460" y="32" text-anchor="end" font-size="30" font-weight="800" fill="#3fe0a0">94.1</text>
    </g>

    <g transform="translate(676 282)">
      <text x="0" y="31" font-size="24" font-weight="800" fill="#6f6b7d">5</text>
      <rect x="34" y="14" width="13" height="13" rx="3" fill="#ff6b4a" transform="rotate(45 40.5 20.5)"/>
      <rect x="62" y="0" width="92" height="42" rx="7" fill="#ff6b4a"/>
      <text x="76" y="28" font-size="18" font-weight="700" fill="#120f0a">✓ 3/3</text>
      <rect x="162" y="0" width="92" height="42" rx="7" fill="#ff6b4a"/>
      <text x="176" y="28" font-size="18" font-weight="700" fill="#120f0a">✓ 3/3</text>
      <rect x="262" y="0" width="92" height="42" rx="7" fill="#ff6b4a"/>
      <text x="276" y="28" font-size="18" font-weight="700" fill="#120f0a">✓ 3/3</text>
      <text x="460" y="32" text-anchor="end" font-size="30" font-weight="800" fill="#ff6b4a">93.1</text>
    </g>
  </g>
</svg>
