[project]
name = "coding-task-benchmark"
version = "0.1.0"
description = "Run one coding task through headless Claude Code and Grok, then score the solutions."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["ruff>=0.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
fastapi = ["fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
ctb = "ctb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctb = ["web/ui.html", "langs/*.md", "langs/*/*.md", "langs/node/eslint.config.mjs", "langs/node/package*.json"]

[tool.ruff.lint]
ignore = ["BLE001", "TRY004", "FLY002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
